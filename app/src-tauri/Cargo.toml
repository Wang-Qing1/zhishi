[package]
name = "zhishi"
version = "0.1.0"
edition = "2021"

[lib]
name = "zhishi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "1"
sha2 = "0.10"
base64 = "0.22"

[profile.release]
opt-level = "s"
lto = true
strip = true
